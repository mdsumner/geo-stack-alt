[workspace]
channels = ['conda-forge']
name = "geo"
platforms = ['linux-64']
version = "0.1.0"

[tasks]

[dependencies]
python = "3.13.*"
numpy = ">=2.5.4,<3"
gdal = ">=3.13.3,<4"
libgdal = ">=3.13.3,<4"
libgdal-arrow-parquet = ">=3.13.3,<4"
r-base = ">=4.5.3,<4.6"
r-gdalraster = ">=2.7.0,<3"
r-jsonlite = ">=2.0.0,<3"
r-curl = ">=8.0.0,<9"
odc-stac = ">=0.5.3,<0.6"
pystac-client = ">=0.9.1,<0.10"
geopandas = ">=1.2.0,<2"
rioxarray = ">=0.24.0,<0.25"
pyarrow = ">=26.0.1,<27"
botocore = ">=1.43.127,<2"
dask = ">=2026.8.0,<2027"

[pypi-dependencies]
stac-geoparquet = ">=0.8, <0.9"
